<div class="p-6 max-w-5xl mx-auto">
  <h2 class="text-xl font-bold text-slate-800 mb-4">Danh sách người dùng</h2>

  <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-sm bg-white">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-600 font-semibold">
          <th class="py-3.5 px-4">Họ và tên</th>
          <th class="py-3.5 px-4">Email</th>
          <th class="py-3.5 px-4">Vai trò</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 text-sm">
        @for (user of user$ | async; track user.id) {
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-3 px-4 font-medium text-slate-800">{{ user.fullName }}</td>
            <td class="py-3 px-4 text-slate-600">{{ user.email }}</td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-1 text-xs font-semibold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-100">
                {{  user.roles }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="py-6 text-center text-slate-400">Không có dữ liệu người dùng</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
