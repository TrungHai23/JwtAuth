<div class="max-w-5xl mx-auto px-4 sm:px-6 py-10">
  <!-- Header của trang -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Quản lý vai trò (Role Management)</h1>
    <p class="text-sm text-slate-500 mt-1">Tạo mới và quản lý các nhóm quyền truy cập trong ứng dụng</p>
  </div>

  <mat-divider class="!mb-8"></mat-divider>

  <!-- Bố cục 2 cột: Trái là Form (5 phần), Phải là Danh sách Role (7 phần) -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
    <div class="md:col-span-5">
      <app-role-form 
        [errorMessage]="errorMessage" 
        [role]="role" 
        (addRole)="createRole($event)">
      </app-role-form>
    </div>

    <!-- Khu vực bên phải (bạn có thể đặt component danh sách Role vào đây sau) -->
    <div class="md:col-span-7">
      <app-role-list [roles]="role$ | async" (deleteRole)="deleteRole($event)"></app-role-list>
    </div>
  </div>
</div>
