<div class="min-h-[calc(100vh-64px)] flex items-center justify-center bg-slate-50 p-6">
  <mat-card class="max-w-md w-full p-8 text-center shadow-lg rounded-2xl bg-white border border-slate-100">
    <!-- Icon / Badge chào mừng -->
    <div class="mx-auto w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 mb-6">
      <mat-icon class="!w-8 !h-8 !text-3xl leading-none">waving_hand</mat-icon>
    </div>

    <!-- Tiêu đề & Nội dung -->
    <h1 class="text-2xl font-bold tracking-tight text-slate-800 mb-2">
      Chào mừng trở lại!
    </h1>
    <p class="text-slate-500 text-sm mb-8 leading-relaxed">
      Hệ thống quản lý xác thực JWT & phân quyền. Đăng nhập để tiếp tục truy cập vào trang quản trị của bạn.
    </p>

    <!-- Nút Login điều hướng sang /login -->
    <div class="flex flex-col gap-3">
      @if(authService.getUserDetails()) {
      <h1 class="text-lg font-semibold text-slate-700 mb-4">
        Bạn đã đăng nhập với tài khoản:
        <span class="text-indigo-600">{{ authService.getUserDetails()?.fullName }}</span>
      </h1>
      }@else {
      <button mat-flat-button routerLink="/login"
        class="!py-6 !rounded-xl !text-base !font-semibold shadow-sm transition-all duration-200">
        <mat-icon class="mr-2">login</mat-icon>
        Đăng nhập ngay
      </button>

      <span class="text-xs text-slate-400 mt-2">
        Chưa có tài khoản?
        <a routerLink="/register" class="text-indigo-600 font-medium hover:underline cursor-pointer">
          Đăng ký
        </a>
      </span>
      }
    </div>
  </mat-card>
</div>
