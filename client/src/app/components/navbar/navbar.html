<div>
    <mat-toolbar class="flex justify-between items-center px-4 bg-indigo-600 text-white shadow-md">
  <!-- Bên trái: Logo / Brand -->
  <div class="flex items-center gap-2">
    <button mat-icon-button class="text-white">
      <mat-icon>menu</mat-icon>
    </button>
    <span routerLink="/" class="text-lg font-bold tracking-wide cursor-pointer select-none">
      JwtAuth App
    </span>
  </div>

  <!-- Bên phải: Profile Menu Trigger -->
  <div class="flex items-center gap-2">
    @if (authService.isLoggedIn()) {
    <div *ngIf="authService.getUserDetails() as currentUser">
          <!-- Nút Avatar kích hoạt Menu -->
      <button 
        mat-button 
        [matMenuTriggerFor]="profileMenu" 
        class="!flex !items-center !gap-2 !py-1 !px-2 !rounded-full !text-white hover:bg-white/10 transition-colors">
        <div class="w-8 h-8 rounded-full bg-indigo-800 text-white flex items-center justify-center font-semibold text-sm ring-2 ring-white/50">
          {{ currentUser.fullName.charAt(0).toUpperCase() }}
        </div>
        <span class="hidden sm:inline font-medium text-sm">{{ currentUser.fullName }}</span>
        <mat-icon class="!text-lg !w-5 !h-5 text-white/80">expand_more</mat-icon>
      </button>

      <!-- Dropdown Menu -->
      <mat-menu #profileMenu="matMenu" xPosition="before" class="!rounded-2xl !p-1 !min-w-[240px] shadow-xl">
        <!-- Header tóm tắt thông tin người dùng -->
        <div class="px-4 py-3 bg-slate-50 border-b border-slate-100 -mt-1 -mx-1 rounded-t-xl">
          <p class="font-semibold text-slate-800 text-sm truncate">{{ currentUser.fullName }}</p>
          <p class="text-xs text-slate-500 truncate">{{ currentUser.email }}</p>
          <span class="inline-block mt-1 px-2 py-0.5 text-[10px] font-semibold tracking-wide text-indigo-700 bg-indigo-100 rounded-md">
            <!-- {{ currentUser.role }} -->
          </span>
        </div>

        <div class="py-1">
          <!-- Item: Trang cá nhân -->
          <button mat-menu-item [routerLink]="['account',currentUser.id]" class="!flex !items-center !gap-3 text-slate-700 hover:text-indigo-600">
            <mat-icon class="text-slate-400">person_outline</mat-icon>
            <span class="text-sm font-medium">Hồ sơ cá nhân</span>
          </button>

          <!-- Item: Đổi mật khẩu / Cài đặt -->
          <button mat-menu-item routerLink="/change-password" class="!flex !items-center !gap-3 text-slate-700 hover:text-indigo-600">
            <mat-icon class="text-slate-400">lock_outline</mat-icon>
            <span class="text-sm font-medium">Đổi mật khẩu</span>
          </button>
        </div>

        <mat-divider></mat-divider>

        <!-- Item: Đăng xuất -->
        <div class="pt-1">
          <button mat-menu-item (click)="logout()" class="!flex !items-center !gap-3 !text-red-600 hover:!bg-red-50">
            <mat-icon class="!text-red-500">logout</mat-icon>
            <span class="text-sm font-semibold">Đăng xuất</span>
          </button>
        </div>
      </mat-menu>
    </div>
    } @else {
      <!-- Khi chưa login -->
      <button mat-button routerLink="/login" class="!text-white hover:bg-white/10">
        <mat-icon class="mr-1">login</mat-icon>
        Đăng nhập
      </button>
       <button mat-button routerLink="/register" class="!text-white hover:bg-white/10">
        <mat-icon class="mr-1">person_add</mat-icon>
        Đăng ký
      </button>
    }
  </div>
</mat-toolbar>
</div>
